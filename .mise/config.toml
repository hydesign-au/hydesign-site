[tools]
node = "26.13.0"
pnpm = "12.18.0"
lefthook = "2.2.2"
jactionlint = "v2.5.0"
oxfmt = "0.75.0"
shellcheck = "0.11.0"

[settings]
experimental = true
pin = true
lockfile = true

[hooks]
postinstall = "lefthook install"

[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Start the dev server on port 3000"
depends = ["deps"]
run = "pnpm dev"

[tasks.build]
depends = ["deps"]
run = "pnpm build"

[tasks.preview]
description = "Serve the production build in the Workers runtime"
run = "pnpm preview"

[tasks.format]
run = "pnpm format"

[tasks.fmt-check]
run = "pnpm fmt-check"

[tasks.lint]
run = "pnpm lint"

[tasks."lint:fix"]
run = "pnpm lint:fix"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.photo]
description = "Add photos to src/assets/photos"
run = "pnpm photo"
