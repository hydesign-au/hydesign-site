monorepo_root = true

[tools]
node = "26.10.0"
pnpm = "12.7.0"
lefthook = "2.1.14"
actionlint = "1.7.12"
oxfmt = "0.70.0"
shellcheck = "0.11.0"
zizmor = "1.30.1"
"npm:vite-plus" = "0.3.3"
"npm:@commitlint/cli" = "21.2.3"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["apps/web", "apps/media", "packages/ui"]

[hooks]
postinstall = "lefthook install"

[tasks.dev]
description = "web dev server on :3000"
run = { task = "//apps/web:dev" }

[tasks.media]
description = "media manager on :4000"
run = { task = "//apps/media:dev" }

[tasks.deps]
description = "install the frozen workspace dependency graph"
run = "pnpm install --frozen-lockfile"

[tasks.format]
description = "format the whole repo (oxfmt via vp)"
run = "vp fmt"

[tasks.fmt-check]
description = "check whole-repo formatting (oxfmt via vp)"
run = "vp fmt --check"

[tasks.lint]
description = "lint the whole repo (oxlint via vp, type-aware)"
run = "vp lint"

[tasks.test]
description = "run media manager tests"
run = { task = "//apps/media:test" }

[tasks.build]
description = "build both apps"
run = [{ task = "//apps/web:build" }, { task = "//apps/media:build" }]
