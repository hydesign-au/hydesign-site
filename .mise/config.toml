monorepo_root = true

[tools]
node = "26.13.0"
pnpm = "12.17.0"
lefthook = "2.2.2"
jactionlint = "v2.4.0"
oxfmt = "0.75.0"
shellcheck = "0.11.0"
"npm:vite-plus" = "1.4.0"

[settings]
experimental = true
pin = true
lockfile = true

[monorepo]
config_roots = ["apps/web", "apps/media", "packages/ui"]

[hooks]
postinstall = "lefthook install"

[tasks.dev]
description = "Start the web server on port 3000"
run = { task = "//apps/web:dev" }

[tasks.media]
description = "Start the media server on port 4000"
run = { task = "//apps/media:dev" }

[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.format]
run = "vp fmt"

[tasks.fmt-check]
run = "vp fmt --check"

[tasks.lint]
description = "Generate Worker types and run type-aware lint checks"
depends = ["//apps/web:cf-typegen"]
run = "vp lint"

[tasks.test]
description = "Run the media manager tests"
run = { task = "//apps/media:test" }

[tasks.build]
run = [{ task = "//apps/web:build" }, { task = "//apps/media:build" }]
