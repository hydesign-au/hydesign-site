[tools]
node = "26.13.1"
pnpm = "12.23.0"
lefthook = "2.2.4"
jactionlint = "v2.6.0"
oxfmt = "0.75.0"

[settings]
experimental = true
pin = true
lockfile = true

[hooks]
postinstall = "lefthook install"

[tasks.deps]
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "Port 3000"
depends = ["deps"]
run = "pnpm dev"

[tasks.build]
depends = ["deps"]
run = "pnpm build"

[tasks.preview]
run = "pnpm preview"

[tasks.format]
run = "pnpm format"

[tasks.fmt-check]
run = "pnpm fmt-check"

[tasks.lint]
run = "pnpm lint"

[tasks."lint:fix"]
run = "pnpm lint:fix"

[tasks.typecheck]
run = "pnpm typecheck"

[tasks.photo]
run = "pnpm photo"
