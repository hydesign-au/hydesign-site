[tasks.dev]
description = "Start the web server on port 3000"
run = "pnpm run dev"

[tasks.build]
description = "Build the Cloudflare Worker"
run = "pnpm run build"

[tasks.preview]
description = "Preview the production build in the Workers runtime"
run = "pnpm run preview"

[tasks.deploy]
description = "Build and deploy the Worker"
run = "pnpm run deploy"

[tasks.cf-typegen]
description = "Generate Cloudflare binding types"
run = "pnpm run cf-typegen"

[tasks.lint]
run = "pnpm run lint"

[tasks.format]
run = "pnpm run format"

[tasks.typecheck]
run = "pnpm run typecheck"
