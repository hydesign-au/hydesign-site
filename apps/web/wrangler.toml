#:schema node_modules/wrangler/config-schema.json
name = "hydesign-com-au"
main = "@tanstack/react-start/server-entry"
compatibility_date = "2026-09-08"
keep_vars = true
workers_dev = true
preview_urls = true

[placement]
region = "gcp:australia-southeast2"

[[routes]]
pattern = "staging.hydesign.com.au"
custom_domain = true

[[routes]]
pattern = "previews.hydesign.com.au"
custom_domain = true
previews_enabled = true
enabled = false

[cache]
enabled = true

[assets]
html_handling = "drop-trailing-slash"

[vars]
INSTAGRAM_BUSINESS_ACCOUNT_ID = "17841400057304568"

[[send_email]]
name = "CONTACT_EMAIL"
destination_address = "signs@hydesign.com.au"
allowed_sender_addresses = ["no-reply@hydesign.com.au"]

[previews.vars]
SHOPIFY_STOREFRONT_DOMAIN = "mock.shop"
SHOPIFY_STOREFRONT_PUBLIC_ACCESS_TOKEN = "foo"
TURNSTILE_SECRET_KEY = "1x0000000000000000000000000000000AA"
TURNSTILE_SITE_KEY = "1x00000000000000000000BB"

[[previews.send_email]]
name = "CONTACT_EMAIL"
destination_address = "signs@hydesign.com.au"
allowed_sender_addresses = ["no-reply@hydesign.com.au"]
