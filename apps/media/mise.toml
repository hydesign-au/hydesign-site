[tasks.dev]
description = "Start the media server on port 4000"
run = "pnpm run dev"

[tasks.build]
run = "pnpm run build"

[tasks.serve]
description = "Serve the built app on port 4000"
run = "pnpm run serve"

[tasks.generate]
description = "Generate the web app’s media index"
run = "pnpm run generate"

[tasks.test]
run = "pnpm run test"

[tasks.lint]
run = "pnpm run lint"

[tasks.format]
run = "pnpm run format"

[tasks.typecheck]
run = "pnpm run typecheck"
